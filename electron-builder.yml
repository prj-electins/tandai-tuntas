appId: app.tandai.tuntas
productName: Tandai Tuntas
artifactName: Tandai-Tuntas-${version}-${os}-${arch}.${ext}
directories:
  app: work/desktop-app
  output: outputs/releases
files:
  - '**/*'
  - '!node_modules/**/*'
asar: true
npmRebuild: false
mac:
  identity: null
  icon: desktop/icon.png
  category: public.app-category.productivity
  target:
    - dmg
win:
  icon: desktop/icon.png
  signExecutable: false
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

dmg:
  background: desktop/installer/background.png
  iconSize: 88
  iconTextSize: 13
  window:
    width: 660
    height: 420
  contents:
    - x: 170
      y: 210
      type: file
    - x: 490
      y: 210
      type: link
      path: /Applications
protocols:
  - name: Tandai Tuntas
    schemes:
      - tandaituntas
