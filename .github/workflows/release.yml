name: Build installers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.2.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            arch: arm64
          - os: macos-latest
            target: mac
            arch: x64
          - os: windows-latest
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/verify-version.mjs
      - run: npm run desktop:build
      - run: node node_modules/electron-builder/cli.js --config electron-builder.yml --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installer-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            outputs/releases/*.dmg
            outputs/releases/*.exe
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Source archive and checksums
        run: |
          git archive --format=zip --prefix=tandai-tuntas/ --output=release-assets/tandai-tuntas-${RELEASE_TAG}-source-complete.zip HEAD
          cd release-assets
          sha256sum *.dmg *.exe *.zip > SHA256SUMS.txt
      - name: Publish assets
        run: |
          if ! gh release view "$RELEASE_TAG"; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Tandai Tuntas $RELEASE_TAG" --notes-file CHANGELOG.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
